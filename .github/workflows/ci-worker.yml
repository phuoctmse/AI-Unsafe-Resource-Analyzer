name: CI — aura-worker

on:
  push:
    branches: [master]
    paths:
      - 'aura-ai-worker/**'
      - '.github/workflows/ci-worker.yml'
  pull_request:
    branches: [master]
    paths:
      - 'aura-ai-worker/**'
      - '.github/workflows/ci-worker.yml'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/aura-worker

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: aura-ai-worker/requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check aura-ai-worker/

  build-and-scan:
    name: Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: aura-ai-worker/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-worker.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        if: always() && hashFiles('trivy-worker.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-worker.sarif
          category: trivy-worker

      - name: Push image (master branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: aura-ai-worker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            WORKER_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
