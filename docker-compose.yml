name: aura

services:
  postgres:
    image: postgres:16-alpine
    container_name: aura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aura
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aura-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: aura-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: aura
      MINIO_ROOT_PASSWORD: aurasecret
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  aura-backend:
    build:
      context: .
      dockerfile: aura-backend/Dockerfile
    container_name: aura-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    environment:
      DATABASE_URL: postgresql://aura:aura@postgres:5432/aura?schema=public
      BACKEND_PORT: "3001"
      REDIS_URL: redis://redis:6379
      SCAN_QUEUE_KEY: aura:scanQueue
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: aura
      S3_SECRET_KEY: aurasecret
      S3_BUCKET: aura-images
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-aura-internal-api-key}
      DASHBOARD_CORS_ORIGINS: ${DASHBOARD_CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  aura-frontend:
    build:
      context: .
      dockerfile: aura-frontend/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3001}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3001}
    container_name: aura-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      aura-backend:
        condition: service_healthy

  aura-worker:
    build:
      context: .
      dockerfile: aura-ai-worker/Dockerfile
    container_name: aura-worker
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      REDIS_URL: redis://redis:6379
      SCAN_QUEUE_KEY: aura:scanQueue
      BACKEND_URL: http://aura-backend:3001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-aura-internal-api-key}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: aura
      S3_SECRET_KEY: aurasecret
      S3_BUCKET: aura-images
      USE_MOCK_INFERENCE: ${USE_MOCK_INFERENCE:-true}
      MODEL_VERSION: ${MODEL_VERSION:-openai/clip-vit-base-patch32}
      CLIP_MODEL_ID: ${CLIP_MODEL_ID:-openai/clip-vit-base-patch32}
      WORKER_VERSION: ${WORKER_VERSION:-docker}
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      aura-backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  hf_cache:
