name: CI — aura-worker

on:
  push:
    branches: [master]
    paths:
      - 'aura-ai-worker/**'
      - '.github/workflows/ci-worker.yml'
  pull_request:
    branches: [master]
    paths:
      - 'aura-ai-worker/**'
      - '.github/workflows/ci-worker.yml'

env:
  LOCAL_IMAGE: aura-worker
  ECR_REPOSITORY: aura-worker

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: aura-ai-worker/requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check aura-ai-worker/

  build-and-scan:
    name: Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: aura-ai-worker/Dockerfile
          push: false
          load: true
          tags: ${{ env.LOCAL_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-worker.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Configure AWS credentials (ECR push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Login to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $LOCAL_IMAGE:$IMAGE_TAG $IMAGE_URI
          docker push $IMAGE_URI

      - name: Upload Trivy results to GitHub Security
        if: always() && hashFiles('trivy-worker.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-worker.sarif
          category: trivy-worker

