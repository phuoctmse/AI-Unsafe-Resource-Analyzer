name: CI — aura-backend

on:
  push:
    branches: [master]
    paths:
      - 'aura-backend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [master]
    paths:
      - 'aura-backend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci-backend.yml'

env:
  LOCAL_IMAGE: aura-backend
  ECR_REPOSITORY: aura-backend

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter aura-backend...

      - name: Generate Prisma client
        working-directory: aura-backend
        env:
          DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/aura?schema=public
        run: pnpm exec prisma generate

      - name: Type check
        working-directory: aura-backend
        run: pnpm exec tsc --noEmit

      - name: Prisma validate
        working-directory: aura-backend
        env:
          DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/aura?schema=public
        run: pnpm exec prisma validate

  build-and-scan:
    name: Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: lint-typecheck
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: aura-backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.LOCAL_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Configure AWS credentials (ECR push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Login to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $LOCAL_IMAGE:$IMAGE_TAG $IMAGE_URI
          docker push $IMAGE_URI

      - name: Upload Trivy results to GitHub Security
        if: always() && hashFiles('trivy-backend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

