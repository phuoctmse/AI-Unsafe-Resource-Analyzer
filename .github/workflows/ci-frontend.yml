name: CI — aura-frontend

on:
  push:
    branches: [master]
    paths:
      - 'aura-frontend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [master]
    paths:
      - 'aura-frontend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci-frontend.yml'

env:
  LOCAL_IMAGE: aura-frontend
  ECR_REPOSITORY: aura-frontend

permissions:
  contents: read

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter aura-frontend...

      - name: Type check
        working-directory: aura-frontend
        run: pnpm exec tsc --noEmit

  build-and-scan:
    name: Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: typecheck
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: aura-frontend/Dockerfile
          push: false
          load: true
          tags: ${{ env.LOCAL_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=http://localhost:3001
            NEXT_PUBLIC_SOCKET_URL=http://localhost:3001
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — vulnerability scan
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Trivy report
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}:${{ github.sha }}
          format: table
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy artifact
        if: always() && hashFiles('trivy-frontend.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-sarif
          path: trivy-frontend.sarif

      - name: Configure AWS credentials (ECR push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Login to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $LOCAL_IMAGE:$IMAGE_TAG $IMAGE_URI
          docker push $IMAGE_URI

      - name: Upload Trivy results to GitHub Security
        if: always() && hashFiles('trivy-frontend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: Fail if Trivy found vulnerabilities
        if: steps.trivy.outcome == 'failure'
        run: |
          echo "Trivy found vulnerabilities. Check the log output above for the affected packages and the SARIF artifact for retention."
          exit 1

